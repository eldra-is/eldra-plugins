name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The org's release-please GitHub App opens the release PR: the repository
      # token may not create pull requests, and PRs it opens get no CI run.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Point the marketplace at the tags this release will create
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          node scripts/sync-marketplace-refs.mjs .
          node scripts/validate-plugins.mjs .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync marketplace refs"
            git push
          fi
